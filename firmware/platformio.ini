; VL53L8CX ToF -> PC 시리얼 (프로토콜 v2)
;
; test_0902/platformio.ini 를 포크했다. 바뀐 것은 monitor_speed 뿐이고
; 보드·메모리·라이브러리 설정은 검증된 원본 그대로 둔다.

[env:yd_esp32_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- 메모리 (N16R8) ---
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi   ; PSRAM (R8 모델)

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Serial 은 UART0(USB-UART 브리지)에 연결된다. 보드의 'UART' 포트를 쓴다.

    ; --- 빔스플리터 crosstalk 대응 (계획서 R1-4) ---
    ; BS 표면 고스트가 거리 ~0 의 가짜 타깃으로 잡혀 실제 시료를 가리면
    ; 아래를 켠다. zone 당 타깃이 2개로 늘어 고스트가 target 0 을 차지해도
    ; 시료가 target 1 에 남는다. 호스트 파서는 필드 개수로 자동 판별한다.
    ; Phase 0.5 에서 crosstalk 가 확인되기 전에는 켜지 말 것 (대역폭 2배).
    ; override 동작 확인함: vl53l8cx_platform_config_default.h:54 가 #ifndef
    ; 로 감싸고 있고, 켜면 RAM 이 24260 -> 24900 byte 로 늘어난다.
    ; -DVL53L8CX_NB_TARGET_PER_ZONE=2

; --- 시리얼 ---
; 921600: status 64개가 늘어 프레임당 약 600 byte / 9 KB/s.
; 115200 은 78% 점유 + 직렬화 지연 28 ms 라 동기화에 쓸 수 없다.
monitor_speed = 921600
upload_speed = 921600

; --- 라이브러리 ---
lib_deps =
    stm32duino/STM32duino VL53L8CX
