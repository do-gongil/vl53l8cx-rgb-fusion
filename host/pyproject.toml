[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toffuse"
version = "0.1.0"
description = "VL53L8CX ToF + RGB 카메라 동축 융합"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "opencv-python>=4.9", "pyserial>=3.5", "pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=toffuse --cov-report=term-missing"
